@if(loading){

  <app-loading></app-loading>

}

@if(notFound) {

  <app-not-found></app-not-found>

}

@if(!loading && !notFound) {

  <section class="product-detail">

    <div class="product-card">

      <div class="image-wrapper">

        <img
          [src]="product?.imagen_url"
          [alt]="product?.titulo"
          class="product-image">

      </div>

      <div class="product-info">

        <span
          class="stock-badge"
          [ngClass]="(product?.stock ?? 0) > 0
                      ? 'available'
                      : 'unavailable'">

          @if((product?.stock ?? 0) > 0) {
            Disponible
          } @else {
            Agotado
          }

        </span>

        <h1>
          {{product?.titulo}}
        </h1>

        <p class="price">
          ${{product?.precio}}
        </p>

        <p class="description">
          {{product?.descripcion}}
        </p>

        <button
          class="add-button"
          [disabled]="product?.stock === 0"
          (click)="saveInStorage()">

          @if(product?.stock === 0) {
            No disponible
          } @else {
            Agregar al carrito
          }

        </button>

      </div>

    </div>

  </section>

}
